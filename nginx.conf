server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/javascript application/json text/css text/plain
               image/svg+xml font/woff2 application/manifest+json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed assets: immutable cache 1 year (Vite generates index-a1b2c3d4.js)
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:jpg|jpeg|png|svg|webp|woff|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html: never cache (ensures users get latest version)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check for Dokploy/Traefik
    location = /health {
        access_log off;
        return 200 "OK";
    }

    # SPA fallback — serves index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
